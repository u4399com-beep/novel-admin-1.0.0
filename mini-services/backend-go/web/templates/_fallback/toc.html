{{define "content"}}
<div class="fb-panel">
  <h2 class="fb-h2">{{.Novel.title}} · 全部章节 <span style="font-size:13px;color:#737373;font-weight:400">共 {{len .Chapters}} 章</span></h2>
  <ul class="fb-rank">
    {{range .Chapters}}<li style="display:flex;justify-content:space-between;align-items:center">
      <a class="fb-novel-title" href="{{chapterURL .id}}">{{.title}}</a>
      <span class="fb-novel-meta">{{wcFmt .wordCount}}</span>
    </li>{{else}}<li>暂无章节</li>{{end}}
  </ul>
</div>
{{end}}
